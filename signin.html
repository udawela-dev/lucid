<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucid — Sign In</title>
  <meta name="description" content="Sign in to the Lucid founder dashboard." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- keep the same navbar so the sign-in feels like part of the site -->
  <header class="navbar" id="navbar">
    <a href="/" class="navbar-brand" aria-label="Lucid home">
      <span>Lucid</span>
    </a>
    <nav class="navbar-links" aria-label="Main navigation">
      <a href="/#problem">Problem</a>
      <a href="/#solution">Solution</a>
      <a href="/#features">Features</a>
    </nav>
    <a href="/#cta" class="btn btn-primary">Join the waitlist</a>
  </header>

  <main style="max-width:72rem;margin:4rem auto;text-align:center;padding:0 1rem;">
    <h1 style="font-size:clamp(2rem,5vw,3rem);margin-bottom:1rem;">Sign In</h1>
    <p style="color:var(--color-text-muted);margin-bottom:2rem;">Founder only area — enter your email and password to open the waitlist dashboard.</p>

    <form class="waitlist-form" style="justify-content:center;" onsubmit="return handleSignInSubmit(this)">
      <input class="input" type="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      <input class="input" type="password" name="password" placeholder="Your password" required />
      <button class="btn btn-primary" type="submit">
        <span class="btn-text">Sign In</span>
        <span class="btn-loader" style="display:none;" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation: spin 1s linear infinite;">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
            <path d="M12 2a10 10 0 0 1 10 10"></path>
          </svg>
        </span>
      </button>
      <span class="waitlist-status" style="display:none; flex-basis:100%; color:var(--color-primary); font-size:0.9375rem;"></span>
    </form>

    <p style="margin-top:2rem; font-size:0.875rem; color:var(--color-text-muted);">
      Not a founder? <a href="/#cta" style="color:var(--color-primary);">Join the waitlist instead</a>
    </p>
  </main>

  <footer class="footer" style="margin-top:3rem;">
    <p class="footer-copy">&copy; 2026 <strong>Lucid</strong>. All rights reserved.</p>
  </footer>

  <script>
    function handleSignInSubmit(form) {
      var emailInput = form.querySelector('input[type="email"]');
      var passwordInput = form.querySelector('input[type="password"]');
      var statusEl = form.querySelector('.waitlist-status');
      var btn = form.querySelector('button.btn-primary');
      var btnText = btn.querySelector('.btn-text');
      var btnLoader = btn.querySelector('.btn-loader');
      var email = emailInput.value.trim();
      var password = passwordInput.value.trim();

      if (!email || !password) {
        statusEl.style.display = 'block';
        statusEl.textContent = 'Please enter both email and password';
        return false;
      }

      // loading state
      btn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline-block';
      statusEl.style.display = 'none';

      // send to the Python server (the browser saves the session cookie
      // automatically from the response's Set-Cookie header)
      fetch("/api/signin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(resp) {
        if (!resp.ok) {
          return resp.json().then(function(err) { throw new Error((err && err.message) || "Server error"); });
        }
        return resp.json();
      })
      .then(function(data) {
        // signed in — go to the founder dashboard
        window.location.href = "/dashboard";
      })
      .catch(function(err) {
        statusEl.style.display = "block";
        statusEl.textContent = err.message || "Something went wrong. Please try again.";
      })
      .finally(function() {
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
      });

      // prevent the default form submit so the page doesn't reload
      return false;
    }
  </script>
</body>
</html>
