<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">One search reaches every place you save</title>
  <desc id="desc">A single Lucid search box connects to Bookmarks, Screenshots, and Messages with equal ease.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="720" height="430" rx="24" fill="url(#bg)"/>

  <!-- one search box -->
  <g filter="url(#soft)">
    <rect x="240" y="34" width="240" height="56" rx="16" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  </g>
  <circle cx="268" cy="62" r="11" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <line x1="277" y1="71" x2="286" y2="80" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <text x="292" y="67" font-family="system-ui, sans-serif" font-size="16" fill="#1E293B" font-weight="600">One search</text>

  <!-- connecting lines -->
  <path d="M300 90 C 300 130, 180 120, 180 170" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M360 90 L 360 170" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M420 90 C 420 130, 540 120, 540 170" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>

  <!-- source card 1: bookmark -->
  <g filter="url(#soft)">
    <rect x="60" y="170" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>
  <rect x="110" y="200" width="80" height="80" rx="40" fill="#EFF6FF"/>
  <path d="M137 220h27v30l-13.5-8-13.5 8z" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="150" y="316" font-family="system-ui, sans-serif" font-size="17" fill="#1E293B" text-anchor="middle" font-weight="600">Bookmarks</text>
  <text x="150" y="338" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">links you saved "for later"</text>
  <text x="150" y="356" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">and forgot</text>

  <!-- source card 2: screenshots -->
  <g filter="url(#soft)">
    <rect x="270" y="170" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>
  <rect x="320" y="200" width="80" height="80" rx="40" fill="#EFF6FF"/>
  <path d="M330 214h13l4-6h13l4 6h10a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H330a4 4 0 0 1-4-4v-18a4 4 0 0 1 4-4z" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="360" cy="236" r="8" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <text x="360" y="316" font-family="system-ui, sans-serif" font-size="17" fill="#1E293B" text-anchor="middle" font-weight="600">Screenshots</text>
  <text x="360" y="338" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">text buried in images,</text>
  <text x="360" y="356" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">searchable anyway</text>

  <!-- source card 3: messages -->
  <g filter="url(#soft)">
    <rect x="480" y="170" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>
  <rect x="530" y="200" width="80" height="80" rx="40" fill="#EFF6FF"/>
  <path d="M545 214h30a4 4 0 0 1 4 4v17l-8-5h-26a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4z" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>
  <text x="570" y="316" font-family="system-ui, sans-serif" font-size="17" fill="#1E293B" text-anchor="middle" font-weight="600">Messages</text>
  <text x="570" y="338" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">links shared with yourself</text>
  <text x="570" y="356" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748B" text-anchor="middle">or friends</text>
</svg>