<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-labelledby="title desc">
  <title id="title">Lucid keeps your data private</title>
  <desc id="desc">A shield illustration showing that Lucid keeps your data on your device — no ads, no selling personal data.</desc>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="460" height="460" rx="32" fill="url(#bg)"/>

  <!-- decorative rings -->
  <circle cx="230" cy="230" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="230" cy="230" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>

  <!-- shield -->
  <g filter="url(#soft)">
    <path d="M230 92 L 320 128 v 96 c 0 62 -38 112 -90 138 -52 -26 -90 -76 -90 -138 v -96 z"
          fill="url(#shield)"/>
  </g>

  <!-- white check inside the shield -->
  <path d="M198 232 l 22 22 l 42 -46" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- little sparkles -->
  <circle cx="356" cy="120" r="5" fill="#FFFFFF"/>
  <circle cx="382" cy="140" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="352" cy="152" r="3" fill="#FFFFFF" opacity="0.6"/>
</svg>